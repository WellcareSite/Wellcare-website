name: Keep GitHub Actions Alive

on:
  schedule:
    # Run weekly on Sunday to check if repository needs an activity ping
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cronjob-based-github-action:
    name: Keepalive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          commit_message: "chore: automated keepalive ping to prevent workflow deactivation"
          committer_username: "github-actions[bot]"
          committer_email: "github-actions[bot]@users.noreply.github.com"
