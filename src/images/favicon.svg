<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210">
  <rect width="210" height="210" rx="40" fill="white"/>
  
  <!-- 5 Dots -->
  <circle cx="28" cy="110" r="12" fill="#e8739b"/>
  <circle cx="62" cy="72" r="14" fill="#66bce8"/>
  <circle cx="104" cy="58" r="15" fill="#f5a623"/>
  <circle cx="152" cy="70" r="14" fill="#f7d94e"/>
  <circle cx="182" cy="108" r="11" fill="#8bc34a"/>

  <!-- Swirling Arm/Body Curve -->
  <path d="M 68 138 C 76 135, 103 140, 108 170" stroke="#2564b3" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Head Circle with White Diagonal Slice -->
  <g transform="translate(123, 137)">
    <circle cx="0" cy="0" r="16" fill="#2564b3"/>
    <!-- Diagonal slice cutout -->
    <path d="M -16 6 L 16 -7 L 16 16 L -16 16 Z" fill="white"/>
    <circle cx="0" cy="0" r="16" stroke="#2564b3" stroke-width="2.5" fill="none"/>
  </g>
</svg>
