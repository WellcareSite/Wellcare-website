<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- White background circle -->
  <circle cx="16" cy="16" r="16" fill="white"/>
  
  <!-- Child figure - matching logo's dark navy style -->
  <!-- Head -->
  <circle cx="18.5" cy="14.5" r="3" fill="#1a3a5c"/>
  <!-- Open crescent on head (makes it look like the logo's head detail) -->
  <circle cx="19.5" cy="13.8" r="1.8" fill="white"/>
  <!-- Body/arm curve - the reaching upward pose -->
  <path d="M 14 20 Q 12 17 13.5 14.5 Q 14.5 13 16 14" stroke="#1a3a5c" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Second arm reaching up -->
  <path d="M 14.5 16 Q 16 13.5 18 13" stroke="#1a3a5c" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Colorful dots arc - exact logo colors -->
  <circle cx="8" cy="12" r="2.2" fill="#89cff0"/>   <!-- light blue -->
  <circle cx="11" cy="7.5" r="2" fill="#e8739b"/>    <!-- pink -->
  <circle cx="15.5" cy="5" r="2.2" fill="#f5a623"/>   <!-- orange -->
  <circle cx="20.5" cy="5.5" r="2" fill="#f7d94e"/>   <!-- yellow -->
  <circle cx="24.5" cy="8.5" r="1.8" fill="#8bc34a"/> <!-- green -->
</svg>
